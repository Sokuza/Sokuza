# Daily refresh of data/stats.json + assets + README.
#
# The `gh` token used to publish this repository has the scopes gist / read:org / repo,
# and GitHub rejects workflow files from tokens without `workflow` scope. To turn the
# nightly refresh on:
#
#   1) gh auth refresh -h github.com -s workflow
#   2) mkdir -p .github/workflows && mv update-workflow.yml .github/workflows/update.yml
#   3) git add .github && git commit -m "Enable nightly stats refresh" && git push
#
# Until then the committed assets are static; refresh them by hand with:
#   python generate.py && git commit -am "Updated stats" && git push

name: update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.py, data/palette.json, data/icons.json]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate
        run: python generate.py ${{ github.event_name == 'schedule' && '--if-changed' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/stats.json README.md
          git diff --cached --quiet || (git commit -m "Updated stats" && git push)
